name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
      - name: Install SDK and NDK
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Verify receive-only surface
        shell: pwsh
        run: .\scripts\Test-ReceiveOnly.ps1
      - name: Build, test, and lint
        shell: pwsh
        working-directory: android
        run: .\gradlew.bat lint test assembleDebug assembleRelease
      - name: Verify packaged native exports
        shell: pwsh
        run: .\scripts\Test-NativeExports.ps1
      - name: Verify schemas and release package
        shell: pwsh
        run: |
          python -m pip install jsonschema==4.25.1
          .\scripts\Test-M4Schemas.ps1
          .\scripts\Test-M5Dependencies.ps1
          .\scripts\Test-M5Release.ps1
          .\scripts\Test-M5Evidence.ps1
      - name: Validate planning
        shell: pwsh
        run: .\scripts\Test-Planning.ps1
